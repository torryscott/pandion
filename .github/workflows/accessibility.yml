name: Accessibility regression
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'standalone/**'
      - 'inst/widget/**'
      - 'R/**'
      - 'website/**'
      - 'docs/user-guide.html'
      - 'scripts/verify/**'
      - 'scripts/prepare-release.sh'
      - '.github/workflows/accessibility.yml'
      - '.github/workflows/build-jmo.yml'
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PS_A11Y_OUT: planning/accessibility-release
      GB2_NODE_BASE: /private/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verification dependencies
        run: |
          sudo mkdir -p /private/tmp
          sudo chown "$USER" /private/tmp
          cd /private/tmp
          npm install playwright@1.62.1 axe-core@4.11.0
          npx playwright install --with-deps chromium
          pip install pypdf==6.10.0
          Rscript -e 'install.packages(c("jmvcore", "R6", "jsonlite"))'
      - name: Build the artifacts under review
        run: |
          git rev-parse HEAD
          bash scripts/minify-widget.sh --check
          bash standalone/build-dist.sh
          bash website/build.sh
      - name: Required accessibility checks
        run: bash scripts/verify/accessibility-run.sh
      - name: Retain results, including failures and open review items
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-evidence
          path: planning/accessibility-release/
          if-no-files-found: warn
