<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Pandion Plots</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<style>
  :root { --navy: #192E49; --cobalt: #375CA0; --ink: #22364d;
          --muted: #5f6f80; --line: #dde5ee; --wash: #f4f7fb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; color: var(--ink); background: var(--wash);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .box { max-width: 520px; padding: 40px 28px; text-align: center; }
  .box img { width: 92px; height: auto; margin-bottom: 18px; }
  h1 { margin: 0 0 10px; color: var(--navy); font-size: 27px;
       letter-spacing: -0.015em; }
  p { margin: 0 0 26px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .links a {
    padding: 10px 18px; border-radius: 8px; text-decoration: none;
    font-weight: 650; font-size: 14.5px;
    color: var(--navy); background: #fff; border: 1px solid #c3d0df;
  }
  .links a:hover { border-color: var(--cobalt); color: var(--cobalt); }
  .links a.primary { color: #fff; background: var(--navy); border-color: var(--navy); }
  .links a.primary:hover { background: #24405f; color: #fff; }
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/diving-straight.svg" alt="">
    <h1>That page is not here.</h1>
    <p>The link may be out of date, or the page may have moved. The osprey
       usually hits what it aims at; this time it missed.</p>
    <div class="links">
      <a class="primary" href="/">Home</a>
      <a href="/app/">Open the app</a>
      <a href="/docs/">User guide</a>
      <a href="/gallery.html">Gallery</a>
    </div>
  </div>
</body>
</html>
