title: Frequencies
name: freqplotbuilder
jus: '3.0'
stage: 0
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variable
        children:
          - type: VariablesListBox
            name: var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Group By (optional)
        children:
          - type: VariablesListBox
            name: groupVar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Panels (optional)
        children:
          - type: VariablesListBox
            name: facetVar
            maxItemCount: 1
            isTarget: true
  # Styled muted-italic by the shared gbPanelTip helper, which finds it
  # by the zero-width marker at the start of the label below. Keep the
  # marker when editing the wording; losing it only means the tip
  # renders plain.
  - type: Label
    margin: small
    label: '​One row per observation, not pre-tabulated counts.'
compilerMode: tame
