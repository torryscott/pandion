title: Likert / Survey
name: likertplotbuilder
jus: '3.0'
stage: 0
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: items
            isTarget: true
  # Styled muted-italic by the shared gbPanelTip helper, which finds it
  # by the zero-width marker at the start of the label below. Keep the
  # marker when editing the wording; losing it only means the tip
  # renders plain.
  - type: Label
    margin: small
    label: '​All items must share one response scale (e.g. 1-5 agreement).'
compilerMode: tame
